name: generate arcade contribution graphs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout repo (for badge.png)
        uses: actions/checkout@v4

      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'breakout'

      - name: embed Pixelify Sans into SVGs
        run: |
          TEXT="JanFebMarAprMayJunJulAugSepOctNovDec"
          CSS=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            "https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&text=$TEXT")
          URL=$(echo "$CSS" | grep -o 'https://[^)]*' | head -1)
          B64=$(curl -s "$URL" | base64 -w0)
          STYLE="<style>@font-face{font-family:'Pixelify Sans';src:url(data:font/woff2;base64,$B64) format('woff2');font-weight:400 700}text{font-family:'Pixelify Sans',monospace !important}</style>"
          for f in dist/*.svg; do
            sed -i "0,/<svg[^>]*>/s||&$STYLE|" "$f"
          done

      - name: replace the ball with badge.png
        run: |
          if command -v convert >/dev/null 2>&1; then
            convert badge.png -resize 96x96 /tmp/ball.png
          else
            cp badge.png /tmp/ball.png
          fi
          python3 - <<'PY'
          import base64, glob, re
          b64 = base64.b64encode(open('/tmp/ball.png', 'rb').read()).decode()
          R = 36  # half-size in px (original ball radius is 5; cells are 20px)
          pat = re.compile(r'<circle id="ball"[^>]*>(.*?)</circle>', re.S)
          for f in glob.glob('dist/*.svg'):
              s = open(f, encoding='utf-8').read()
              def repl(m):
                  return (f'<image id="ball" href="data:image/png;base64,{b64}" '
                          f'x="-{R}" y="-{R}" width="{2*R}" height="{2*R}" '
                          f'preserveAspectRatio="xMidYMid slice">{m.group(1)}</image>')
              s, n = pat.subn(repl, s, count=1)
              open(f, 'w', encoding='utf-8').write(s)
              print(f, 'ball replaced:', n)
          PY
          
      - name: build typing SVG (my font)
        run: |
          python3 - <<'PY'
          import base64
          from xml.sax.saxutils import escape

          b64 = base64.b64encode(open('animeace2_reg.ttf', 'rb').read()).decode()
          lines = [
              "Welcome to my profile!",
              "Full-stack Developer",
              "What would life be without challenges?",
          ]
          CPS = 0.07    # seconds per typed character
          HOLD = 1.5    # seconds a finished line stays visible
          GAP = 0.3     # blank pause before the next line

          slots, t = [], 0.0
          for line in lines:
              slot = len(line) * CPS + HOLD + GAP
              slots.append((t, slot))
              t += slot
          total = t

          texts = ""
          for line, (start, slot) in zip(lines, slots):
              b = (start + slot) / total
              spans = ""
              for i, ch in enumerate(line):
                  a = (start + (i + 1) * CPS) / total
                  spans += (
                      f'<tspan fill-opacity="0">{escape(ch)}'
                      f'<animate attributeName="fill-opacity" values="0;1;0" '
                      f'keyTimes="0;{a:.5f};{b:.5f}" calcMode="discrete" '
                      f'dur="{total:.2f}s" repeatCount="indefinite"/></tspan>'
                  )
              texts += (
                  f'<text x="400" y="34" text-anchor="middle" xml:space="preserve">'
                  f'{spans}</text>'
              )

          svg = (
              '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="50" viewBox="0 0 800 50">'
              f"<style>@font-face{{font-family:'AnimeAce';src:url(data:font/ttf;base64,{b64}) format('truetype')}}"
              "text{font-family:'AnimeAce',sans-serif;font-size:24px;fill:#D0F0C0}</style>"
              f'{texts}</svg>'
          )
          open('dist/typing.svg', 'w', encoding='utf-8').write(svg)
          print('typing.svg written, cycle', round(total, 1), 's')
          PY
          
      - name: build title SVGs (my font)
        run: |
          python3 - <<'PY'
          import base64

          b64 = base64.b64encode(open('animeace2_reg.ttf', 'rb').read()).decode()
          style = (
              f"<style>@font-face{{font-family:'AnimeAce';src:url(data:font/ttf;base64,{b64}) format('truetype')}}"
              "text{font-family:'AnimeAce',sans-serif}</style>"
          )

          titles = {
              'h-hello': 'Hello',
              'h-tech': '&lt;/&gt; Tech Stack:',
              'h-stats': 'GitHub Stats:',
          }
          for name, text in titles.items():
              svg = (
                  '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="50">'
                  f'{style}<text x="0" y="36" font-size="32" fill="#e6edf3">{text}</text></svg>'
              )
              open(f'dist/{name}.svg', 'w', encoding='utf-8').write(svg)
              print(name, 'written')
          PY

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
