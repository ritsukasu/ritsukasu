name: generate arcade contribution graphs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout repo (for badge.png)
        uses: actions/checkout@v4

      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'breakout'

      - name: embed Pixelify Sans into SVGs
        run: |
          TEXT="JanFebMarAprMayJunJulAugSepOctNovDec"
          CSS=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            "https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&text=$TEXT")
          URL=$(echo "$CSS" | grep -o 'https://[^)]*' | head -1)
          B64=$(curl -s "$URL" | base64 -w0)
          STYLE="<style>@font-face{font-family:'Pixelify Sans';src:url(data:font/woff2;base64,$B64) format('woff2');font-weight:400 700}text{font-family:'Pixelify Sans',monospace !important}</style>"
          for f in dist/*.svg; do
            sed -i "0,/<svg[^>]*>/s||&$STYLE|" "$f"
          done

      - name: replace the ball with badge.png
        run: |
          pip install pillow
          python3 - <<'PY'
          import base64, glob, io, re
          from PIL import Image
          img = Image.open('badge.png').convert('RGBA')
          img.thumbnail((96, 96))
          buf = io.BytesIO()
          img.save(buf, 'PNG', optimize=True)
          b64 = base64.b64encode(buf.getvalue()).decode()
          defs = (
              '<defs><pattern id="ballimg" patternContentUnits="objectBoundingBox" width="1" height="1">'
              '<image href="data:image/png;base64,' + b64 + '" width="1" height="1" preserveAspectRatio="xMidYMid slice"/>'
              '</pattern></defs>'
              '<style>circle{fill:url(#ballimg) !important}</style>'
          )
          for f in glob.glob('dist/*.svg'):
              s = open(f, encoding='utf-8').read()
              s = re.sub(r'(<svg[^>]*>)', lambda m: m.group(1) + defs, s, count=1)
              open(f, 'w', encoding='utf-8').write(s)
          PY

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
