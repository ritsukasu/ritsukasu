name: generate arcade contribution graphs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout repo (for badge.png)
        uses: actions/checkout@v4

      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'breakout'

      - name: embed Pixelify Sans into SVGs
        run: |
          TEXT="JanFebMarAprMayJunJulAugSepOctNovDec"
          CSS=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            "https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&text=$TEXT")
          URL=$(echo "$CSS" | grep -o 'https://[^)]*' | head -1)
          B64=$(curl -s "$URL" | base64 -w0)
          STYLE="<style>@font-face{font-family:'Pixelify Sans';src:url(data:font/woff2;base64,$B64) format('woff2');font-weight:400 700}text{font-family:'Pixelify Sans',monospace !important}</style>"
          for f in dist/*.svg; do
            sed -i "0,/<svg[^>]*>/s||&$STYLE|" "$f"
          done

      - name: replace the ball with badge.png
        run: |
          if command -v convert >/dev/null 2>&1; then
            convert badge.png -resize 96x96 /tmp/ball.png
          else
            cp badge.png /tmp/ball.png
          fi
          python3 - <<'PY'
          import base64, glob, re
          b64 = base64.b64encode(open('/tmp/ball.png', 'rb').read()).decode()
          R = 36  # half-size in px (original ball radius is 5; cells are 20px)
          pat = re.compile(r'<circle id="ball"[^>]*>(.*?)</circle>', re.S)
          for f in glob.glob('dist/*.svg'):
              s = open(f, encoding='utf-8').read()
              def repl(m):
                  return (f'<image id="ball" href="data:image/png;base64,{b64}" '
                          f'x="-{R}" y="-{R}" width="{2*R}" height="{2*R}" '
                          f'preserveAspectRatio="xMidYMid slice">{m.group(1)}</image>')
              s, n = pat.subn(repl, s, count=1)
              open(f, 'w', encoding='utf-8').write(s)
              print(f, 'ball replaced:', n)
          PY
          
      - name: build title SVGs (my font)
        run: |
          B64=$(base64 -w0 animeace2_reg.ttf)
          STYLE="<style>@font-face{font-family:'AnimeAce';src:url(data:font/ttf;base64,$B64) format('truetype')}text{font-family:'AnimeAce',sans-serif}</style>"

          mk() {
            printf '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="50">%s<text x="0" y="36" font-size="32" fill="#e6edf3">%s</text></svg>' "$STYLE" "$2" > "dist/$1.svg"
          }
          mk h-hello "Hello"
          mk h-tech "&lt;/&gt; Tech Stack:"
          mk h-stats "GitHub Stats:"

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
